name: Build liblqm_menu.so

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Show NDK location
        run: |
          echo "NDK=$ANDROID_NDK_HOME"
          ls $ANDROID_NDK_HOME

      - name: Download Dobby prebuilt
        run: |
          git clone --depth 1 https://github.com/3equals3/DobbyHook.git dobby_prebuilt
          find dobby_prebuilt -type f

      - name: Copy libdobby.a + Dobby.h
        run: |
          cp $(find dobby_prebuilt -name "libdobby.a" | head -1) ./libdobby.a
          cp $(find dobby_prebuilt -name "Dobby.h" | head -1) ./Dobby.h
          ls -la libdobby.a Dobby.h

      - name: Compile liblqm_menu.so
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++ \
            -shared -fPIC -O2 -std=c++20 \
            -I. \
            lqm_menu.cpp libdobby.a \
            -llog -ldl -lEGL -lGLESv3 \
            -o liblqm_menu.so

      - name: Verify output
        run: |
          file liblqm_menu.so
          ls -la liblqm_menu.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liblqm_menu
          path: liblqm_menu.so
