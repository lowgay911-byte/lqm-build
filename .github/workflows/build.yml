name: Build liblqm_menu.so

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Clone Dobby
        run: git clone --depth 1 https://github.com/jmpews/Dobby.git dobby_src

      - name: Build Dobby for arm64 with -fPIC
        run: |
          cd dobby_src
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=28 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_ANDROID_NDK=$ANDROID_NDK_HOME \
            -DCMAKE_C_COMPILER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
            -DCMAKE_CXX_COMPILER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++ \
            -DCMAKE_C_FLAGS="-fPIC -fvisibility=default" \
            -DCMAKE_CXX_FLAGS="-fPIC -fvisibility=default" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          make -j4
          find . -name "libdobby.a"

      - name: Copy libdobby.a
        run: |
          cp $(find dobby_src -name "libdobby.a" | head -1) ./libdobby.a
          ls -la libdobby.a

      - name: Compile liblqm_menu.so
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++ \
            -shared -fPIC -O2 -std=c++20 \
            -I. \
            lqm_menu.cpp libdobby.a \
            -llog -ldl -lEGL -lGLESv3 \
            -o liblqm_menu.so

      - name: Verify output
        run: |
          file liblqm_menu.so
          ls -la liblqm_menu.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liblqm_menu
          path: liblqm_menu.so
